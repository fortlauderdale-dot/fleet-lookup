<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Asset Lookup</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --ink:#1b2733; --muted:#5d6b78; --line:#d9dfe5;
    --nav:#14283d; --nav-ink:#ffffff; --accent:#1f6feb; --accent-soft:#e8f0fe;
    --ok:#1a7f45; --ok-bg:#e3f4ea; --bad:#b42318; --bad-bg:#fde8e6;
    --info:#175cd3; --info-bg:#e5eefc; --warn:#9a5b00; --warn-bg:#fdf1d9;
    --field:#f7f9fb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1720; --panel:#17212c; --ink:#e6ecf2; --muted:#9aa9b8; --line:#2a3846;
      --nav:#0b141e; --accent:#5b9bff; --accent-soft:#1c2c44;
      --ok:#5fd08d; --ok-bg:#16301f; --bad:#ff8a7e; --bad-bg:#3a1b18;
      --info:#7fb0ff; --info-bg:#1b2b47; --warn:#f2c36b; --warn-bg:#382a10;
      --field:#1b2733;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header.top{background:var(--nav);color:var(--nav-ink);display:flex;align-items:center;gap:20px;padding:10px 20px;position:sticky;top:0;z-index:10}
  .brand{font-weight:650;font-size:16px;white-space:nowrap;cursor:pointer}
  .brand small{display:block;font-weight:400;font-size:11px;opacity:.7}
  .searchwrap{position:relative;flex:1;max-width:560px}
  .searchwrap input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid transparent;font-size:15px;background:#fff;color:#1b2733}
  .searchwrap input:focus{outline:3px solid #7fb0ff}
  .hint{font-size:12px;opacity:.7;white-space:nowrap}
  main{max-width:1300px;margin:0 auto;padding:20px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .tile .n{font-size:26px;font-weight:650;line-height:1.1}
  .tile .l{color:var(--muted);font-size:12px}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
  .filters label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
  select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font-size:14px;min-width:170px}
  button{font:inherit;cursor:pointer}
  .btn{padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
  .btn:hover{background:var(--accent-soft)}
  .btn[disabled]{opacity:.4;cursor:default}
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:sticky;top:0;background:var(--panel);font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
  th .arr{opacity:.8}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--accent-soft)}
  td.asset{font-weight:600;color:var(--accent)}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .b-ok{background:var(--ok-bg);color:var(--ok)} .b-bad{background:var(--bad-bg);color:var(--bad)}
  .b-gray{background:var(--field);color:var(--muted);border:1px solid var(--line)}
  .b-info{background:var(--info-bg);color:var(--info)} .b-warn{background:var(--warn-bg);color:var(--warn)}
  .pager{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 4px;color:var(--muted)}
  .empty{padding:40px;text-align:center;color:var(--muted)}

  /* detail */
  .crumbs{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .crumbs .pos{color:var(--muted)}
  .titlebar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .titlebar h1{margin:0;font-size:20px}
  .titlebar .sub{color:var(--muted)}
  .tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
  .tab{padding:10px 14px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
  @media (max-width:900px){.cols{grid-template-columns:1fr}}
  fieldset{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px 16px 16px;margin:0 0 16px}
  legend{padding:0 8px;font-size:15px;font-weight:600}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(6,minmax(0,1fr))}
  .f{display:flex;flex-direction:column;gap:3px;grid-column:span 2}
  .f.s3{grid-column:span 3} .f.s4{grid-column:span 4} .f.s6{grid-column:span 6} .f.s2{grid-column:span 2}
  .f label{font-size:11px;color:var(--muted)}
  .f .box{min-height:36px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);overflow-wrap:anywhere}
  .f .box.has{background:var(--panel);font-weight:500}
  .checks{display:flex;gap:22px;flex-wrap:wrap;padding-top:6px}
  .checks label{display:flex;gap:7px;align-items:center;color:var(--ink)}
  .box.tall{min-height:150px}
  .f .box.calc{background:transparent;border-style:dashed}
  .cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  @media (max-width:900px){.cols2{grid-template-columns:1fr}}
  .tablewrap.static th{cursor:default}
  .qf{margin-bottom:10px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  .stat .sl{font-size:12px;color:var(--muted)} .stat .sv{font-size:20px;font-weight:650;line-height:1.25} .stat .ss{font-size:12px;color:var(--muted)}
  .chips{display:flex;gap:8px;margin-bottom:12px}.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 11px;font-size:12px;font-weight:600}
  .grp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px 12px;margin-bottom:12px}
  .grp h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
  .kvg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 18px}
  .kv span{display:block;font-size:11px;color:var(--muted)} .kv b{font-weight:500;overflow-wrap:anywhere} .kv .none{color:var(--muted);font-style:normal}
  .tog{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
  .cmt{padding:12px 16px}.cmeta{color:var(--muted);font-size:12px;margin-bottom:2px}
  .qf input{width:100%;max-width:340px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);font:inherit}
  .tabs.sub{margin-top:-4px}
  .tabs.sub .tab{padding:8px 14px}
  .gauge{height:120px;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
  .note{color:var(--muted);padding:6px 2px}
  .tabempty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:48px 20px;text-align:center;color:var(--muted)}
  .tabempty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brand">Fort Lauderdale Fleet<small>Asset lookup</small></div>
  <div class="searchwrap">
    <input id="q" type="search" autocomplete="off" placeholder="Type a vehicle number (V10060), plate, VIN, make, model, contact, notes..." aria-label="Search vehicles">
  </div>
  <div class="hint">Press / to search. Enter opens an exact match.</div>
</header>
<main id="app"><div class="empty">Loading vehicles...</div></main>

<script>
(function(){
  var DATA=[], BY={}, filtered=[], sortKey='asset', sortDir=1, page=0, PAGE=100;
  var f={dept:'',division:'',status:'',supervisor:''}, query='', tab='Overview', showEmpty=false;
  var app=document.getElementById('app'), q=document.getElementById('q');

  var TABS=['Overview','Life Cycle','Scheduling','Maintenance','Part Usage','Fuel','Meter Updates','Comments/Notes','Documents','Pictures','Occupants','Recalls','Purchase Orders'];
  var TABNOTE={
    'Documents':'Every file for this vehicle will live here, in one place.',
    'Purchase Orders':'Purchase orders will be created and tracked here.'
  };
  var subtab='Services';

  function sec(title,inner){return '<fieldset><legend>'+esc(title)+'</legend>'+inner+'</fieldset>'}
  function grid(inner){return '<div class="grid">'+inner+'</div>'}
  function calc(label,span,val){var has=val!==undefined&&val!==null&&val!=='';return '<div class="f '+(span||'')+'"><label>'+esc(label)+(val===undefined?' (calculated)':'')+'</label><div class="box calc'+(has?' has':'')+'">'+(has?esc(val):'')+'</div></div>'}
  function chk2(label,on){return '<div class="f s6"><div class="checks"><label><input type="checkbox" disabled'+(on?' checked':'')+'> '+esc(label)+'</label></div></div>'}
  function qf(ph){return '<div class="qf"><input disabled placeholder="'+esc(ph)+'" aria-label="'+esc(ph)+'"></div>'}
  function tblRows(cols,rows){
    return '<div class="tablewrap static"><table><thead><tr>'+cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>'+
      rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';
  }
  function tbl(cols){
    return '<div class="tablewrap static"><table><thead><tr>'+cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead></table><div class="empty">No records to display.</div></div>';
  }

  function isE(x){return x===undefined||x===null||x===''}
  function kv(label,val){ if(isE(val)&&!showEmpty) return ''; return '<div class="kv"><span>'+esc(label)+'</span><b>'+(isE(val)?'<i class="none">&mdash;</i>':esc(val))+'</b></div>' }
  function grp(title,items){ var h=items.join(''); if(!h) return ''; return '<section class="grp"><h3>'+esc(title)+'</h3><div class="kvg">'+h+'</div></section>' }
  function stat(label,val,sub){ return '<div class="stat"><div class="sl">'+esc(label)+'</div><div class="sv">'+(isE(val)?'&mdash;':esc(val))+'</div>'+(sub?'<div class="ss">'+esc(sub)+'</div>':'')+'</div>' }
  function yn(b){return b?'Yes':''}
  function rnd(n){return Math.round(Number(n)).toLocaleString('en-US')}
  function usage(v){ if(v.meter==null)return ''; if(v.meterType==='No Meter'&&!v.meter)return ''; return rnd(v.meter)+(v.meterType==='Engine Hours'?' hours':' miles') }
  function eqShown(v){ return v.milesEq&&Math.round(v.milesEq)!==Math.round(v.meter||0) }
  function toggle(){return '<label class="tog"><input type="checkbox" id="se"'+(showEmpty?' checked':'')+'> Show empty fields</label>'}

  var TABFN={
    'Overview':function(v){
      var hrs=v.meterType==='Engine Hours';
      var chips=[v.hasGPS?'GPS':'',v.hasCamera?'Camera':'',v.hasCanceiver?'Canceiver':''].filter(Boolean).map(function(c){return '<span class="chip">'+c+'</span>'}).join('');
      return '<div class="stats">'+
          stat(hrs?'Engine hours':'Mileage',usage(v))+
          (eqShown(v)?stat('Miles equivalent',rnd(v.milesEq)+' miles'):'')+
          stat('In service',v.inServiceDate)+
          stat('Projected replacement',v.projDate,v.projCost?money(v.projCost):'')+
          stat('Annual escrow',v.calcEscrow?money(v.annualEscrow):'Not calculated')+
        '</div>'+(chips?'<div class="chips">'+chips+'</div>':'')+
        '<div class="cols2">'+
        '<div>'+
          grp('Vehicle',[kv('Year',v.year),kv('Make',v.make),kv('Model',v.model),kv('Category',v.category),kv('Type',v.type),kv('Sub type',v.subType),kv('Class code',v.classCode),kv('Service class',v.serviceClass),kv('FEMA code',v.fema),kv('VIN / serial',v.vin),kv('License plate',v.plate),kv('Key code',''),kv('Replaces',v.replaced),kv('Replaced by',v.replacedBy)])+
          grp('Fuel and fluids',[kv('Fuel type',''),kv('Fuel tank size',v.fuelTank),kv('Oil type',v.oilType),kv('Oil tank size','')])+
          grp('Engine and drivetrain',[kv('Engine code',''),kv('Engine size',''),kv('Engine make',''),kv('Engine model',''),kv('Size/CID',''),kv('HP',''),kv('Transmission make',''),kv('Wheel configuration',v.wheelConfig),kv('Wheel base',v.wheelBase)])+
          grp('Tires',[kv('Front size',''),kv('Back size',''),kv('Front PSI',''),kv('Back PSI',''),kv('No. rear tires',''),kv('Rear end cap',''),kv('Tons',''),kv('Wheel size','')])+
        '</div><div>'+
          grp('Assignment',[kv('Department',v.dept),kv('Division',v.division),kv('GL code',v.glCode),kv('Fund',v.fund)])+
          grp('Contact',[kv('Name',v.contact),kv('Email',v.contactEmail),kv('Phone',v.contactPhone)])+
          grp('Supervisor',[kv('Name',v.supervisor),kv('Email',v.supervisorEmail),kv('Phone',v.supervisorPhone)])+
          grp('Replacement',[kv('Score',''),kv('Condition','')])+
        '</div></div>';
    },
    'Life Cycle':function(v){
      return '<div class="cols2"><div>'+
        grp('Acquisition',[kv('Acquisition type',''),kv('Purchased from',''),kv('PO number',v.poNumber),kv('PO created',v.poDate),kv('Received',v.receivedDate),kv('In service',v.inServiceDate),kv('Purchase amount',money(v.purchaseAmount)),kv('Upfit total',money(v.upfitTotal)),kv('Capital cost',money(v.capitalCost))])+
        grp('Value',[kv('Starting value',money(v.startingValue)),kv('Current value',money(v.currentValue)),kv('User estimated value',''),kv('Salvage',''),kv('Date salvage amount hit','')])+
      '</div><div>'+
        grp('Replacement',[kv('Replacement model',v.replacementModel),kv('Life cycle (years)',v.lifeCycle==null?'':String(v.lifeCycle)),kv('Projected date',v.projDate),kv('Projected cost',money(v.projCost)),kv('Proposed replacement type',''),kv('Yearly inflation rate',v.inflation==null?'':v.inflation+'%'),kv('Replacement date overridden',yn(v.overrideDate)),kv('Projected cost overridden',yn(v.overrideCost))])+
        grp('Escrow',[kv('Calculate escrow',v.calcEscrow?'Yes':'No'),kv('Annual escrow',money(v.annualEscrow))])+
      '</div></div>';
    },
    'Maintenance':function(v){
      return sec('Work Order History',
        '<div class="cols"><div>'+qf('Quick filter (complaint, WO #)')+
          tbl(['Work Order','Status','Date','Description','Days Down','Total Cost'])+
        '</div><div>'+
          grid(fld('Status','','s6')+fld('Complaint','','s6')+fld('Open Date','','s3')+fld('Open Time','','s3')+fld('Close Date','','s3')+fld('Close Time','','s3')+
            fld('System (for example, Wheels & Tire System)','','s6'))+
          '<div style="display:flex;gap:10px;margin-top:12px"><button class="btn" disabled>Go to Work Order</button><button class="btn" disabled>Work Order Summary</button></div>'+
        '</div></div>')+
        '<div class="note">Days Down will calculate from the open and close dates and times. Creating new work orders comes in the next phase.</div>';
    },
    'Part Usage':function(v){
      return qf('Quick filter (description, part, request ID)')+
        tbl(['Part #','Category','Type','Sub Type','Manufacturer','Quantity','Cost','PO','Status','Issue Date'])+
        '<div style="height:16px"></div>'+
        sec('Parts',grid(fld('Actual WO','','s3')+fld('Work Order','','s3')+chk2('Use Managed Part')+
          fld('Description (required)','','s2')+fld('Part Category','','s4')+
          fld('Status','','s2')+fld('Date','','s2')+fld('Quantity','','s2')+fld('Part Failure','','s6')+
          fld('Part Cost','','s2')+fld('Total','','s2')+
          '<div class="f s2"><div class="checks"><label><input type="checkbox" disabled> This part is billable</label><label><input type="checkbox" disabled> Is this part taxable?</label></div></div>'))+
        sec('Part Inventory Cost','<div class="note">Waiting on the inventory cost fields.</div>');
    },
    'Fuel':function(v){
      return qf('Quick filter')+tbl(['Fuel #','Asset','Fuel Type','Meter 1','Meter 2','Transaction Date']);
    },
    'Meter Updates':function(v){
      var cols=['Meter','Meter Type','Elapsed Meter','Date of Reading','Source of Reading'];
      var rows=[];
      if(v.meter!=null) rows.push(['Meter 1',v.meterType||'',meter(v.meter),'','Collective Data export (11/24/2026)']);
      return '<div class="grid" style="max-width:520px;margin-bottom:12px">'+fld('Meter Type','','s3')+fld('Readings Since','','s3')+'</div>'+
        qf('Quick filter')+(rows.length?tblRows(cols,rows):tbl(cols))+
        '<div class="note">This is the latest reading carried over from Collective Data. The date of each reading is not in the export. Readings from the EJ Ward fuel system will add rows here in a later phase.</div>';
    },
    'Comments/Notes':function(v){
      return sec('Comments','<div class="f s6"><label>Add a comment</label><div class="box tall" style="min-height:90px"></div></div>')+
        qf('Search this vehicle\'s comments')+
        '<div class="tablewrap static">'+(v.comments?'<div class="cmt"><div class="cmeta">Imported from Collective Data (no date or author)</div><div>'+esc(v.comments)+'</div></div>':'<div class="empty">No comments yet. Work order notes will show up here automatically with the date, WO number, and who wrote them.</div>')+'</div>';
    },
    'Scheduling':function(v){
      var subs=['Services','Warranty','Registration','Notification'];
      var bar='<div class="tabs sub">'+subs.map(function(s){return '<button class="tab'+(s===subtab?' on':'')+'" data-st="'+s+'">'+s+'</button>'}).join('')+'</div>';
      if(subtab!=='Services') return bar+'<div class="tabempty"><b>'+subtab+'</b>Nothing here yet. This fills in once the data is loaded.</div>';
      return bar+
        '<div class="cols"><div>'+
          fld('Asset PM Template Setup','','s6')+'<div style="height:12px"></div>'+
          sec('PM Services',tbl(['Task','Schedule','Due Date','Days Left','Meter Left']))+
        '</div><div>'+
          sec('Selected PM Service',grid(
            fld('PM Service','','s6')+
            fld('Schedule Type','','s3')+fld('Miles','','s3')+fld('Fuel Usage','','s3')+chk2('Is this Scheduled Item Recurring?')+
            fld('Schedule Every','','s3')+fld('Elapsed Time Type','','s3')+chk2('Ignore Season')+fld('Days Ahead Can Schedule','','s3')+
            fld('PM Schedule Template','','s6')+fld('Scheduled Date','','s3')+chk2('Scheduled Date is User Controlled')))+
        '</div></div>';
    }
  };

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function norm(s){return String(s||'').toLowerCase()}
  function num(a){return parseInt(String(a).replace(/\D/g,''),10)||0}
  function money(n){return n==null?'':'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
  function meter(n){return n==null?'':Number(n).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1})}
  function badge(s){
    var c={'In Service':'b-ok','Out of Service':'b-bad','New Vehicle Prep':'b-info','Awaiting Pickup':'b-warn','Retired- Awaiting Disposal':'b-gray'}[s]||'b-info';
    return s?'<span class="badge '+c+'">'+esc(s)+'</span>':'';
  }
  function uniq(arr){var o={};arr.forEach(function(x){if(x)o[x]=1});return Object.keys(o).sort(function(a,b){return a.localeCompare(b)})}

  function cmp(a,b){
    var k=sortKey, r;
    if(k==='asset') r=num(a.asset)-num(b.asset);
    else if(k==='year') r=(parseInt(a.year)||0)-(parseInt(b.year)||0);
    else r=String(a[k]).localeCompare(String(b[k]),undefined,{numeric:true});
    if(r===0) r=num(a.asset)-num(b.asset);
    return r*sortDir;
  }

  function applyFilters(){
    var toks=norm(query).split(/\s+/).filter(Boolean);
    filtered=DATA.filter(function(v){
      if(f.dept&&v.dept!==f.dept)return false;
      if(f.division&&v.division!==f.division)return false;
      if(f.status&&v.status!==f.status)return false;
      if(f.supervisor&&v.supervisor!==f.supervisor)return false;
      if(!toks.length)return true;
      var hay=norm([v.asset,v.year,v.make,v.model,v.dept,v.division,v.status,v.plate,v.vin,v.category,v.type,v.classCode,v.contact,v.supervisor,v.glCode,v.comments].join(' '));
      return toks.every(function(t){return hay.indexOf(t)!==-1});
    });
    filtered.sort(cmp);
    var exact=normAsset(query);
    if(exact){
      var i=filtered.findIndex(function(v){return v.asset===exact});
      if(i>0){var m=filtered.splice(i,1)[0];filtered.unshift(m)}
    }
  }
  function normAsset(s){
    s=String(s||'').trim().toUpperCase().replace(/\s+/g,'');
    if(!s)return null;
    if(BY[s])return s;
    if(/^\d+$/.test(s)&&BY['V'+s])return 'V'+s;
    return null;
  }

  function render(){
    var id=decodeURIComponent(location.hash.slice(1));
    if(id&&BY[id]) renderDetail(BY[id]); else renderList();
  }

  function renderList(){
    document.title='Fleet Asset Lookup';
    var inSvc=0,out=0,oth=0,ret=0;
    filtered.forEach(function(v){if(v.status==='In Service')inSvc++;else if(v.status==='Out of Service')out++;else if(/^Retired/.test(v.status))ret++;else oth++});
    var depts=uniq(DATA.map(function(v){return v.dept}));
    var divs=uniq(DATA.filter(function(v){return !f.dept||v.dept===f.dept}).map(function(v){return v.division}));
    var statuses=uniq(DATA.map(function(v){return v.status}));
    var sups=uniq(DATA.map(function(v){return v.supervisor}));
    function opts(list,sel,all){return '<option value="">'+all+'</option>'+list.map(function(x){return '<option'+(x===sel?' selected':'')+' value="'+esc(x)+'">'+esc(x)+'</option>'}).join('')}
    var pages=Math.max(1,Math.ceil(filtered.length/PAGE)); if(page>=pages)page=pages-1;
    var slice=filtered.slice(page*PAGE,page*PAGE+PAGE);
    function th(k,l){return '<th data-k="'+k+'">'+l+(sortKey===k?' <span class="arr">'+(sortDir>0?'&#9650;':'&#9660;')+'</span>':'')+'</th>'}
    var rows=slice.map(function(v){
      return '<tr data-id="'+esc(v.asset)+'"><td class="asset">'+esc(v.asset)+'</td><td>'+esc(v.year)+'</td><td>'+esc(v.make)+'</td><td>'+esc(v.model)+'</td><td>'+esc(v.dept)+'</td><td>'+esc(v.division)+'</td><td>'+esc(v.contact)+'</td><td>'+badge(v.status)+'</td></tr>';
    }).join('');
    app.innerHTML=
      '<div class="tiles">'+
        '<div class="tile"><div class="n">'+filtered.length.toLocaleString()+'</div><div class="l">Vehicles shown (of '+DATA.length.toLocaleString()+')</div></div>'+
        '<div class="tile"><div class="n">'+inSvc.toLocaleString()+'</div><div class="l">In Service</div></div>'+
        '<div class="tile"><div class="n">'+out.toLocaleString()+'</div><div class="l">Out of Service</div></div>'+
        '<div class="tile"><div class="n">'+ret.toLocaleString()+'</div><div class="l">Retired, awaiting disposal</div></div>'+
        '<div class="tile"><div class="n">'+oth.toLocaleString()+'</div><div class="l">Prep or awaiting pickup</div></div>'+
      '</div>'+
      '<div class="filters">'+
        '<label>Department<select id="fd">'+opts(depts,f.dept,'All departments')+'</select></label>'+
        '<label>Division<select id="fv">'+opts(divs,f.division,'All divisions')+'</select></label>'+
        '<label>Status<select id="fs">'+opts(statuses,f.status,'All statuses')+'</select></label>'+
        '<label>Supervisor<select id="fu">'+opts(sups,f.supervisor,'All supervisors')+'</select></label>'+
        '<button class="btn" id="clr">Clear filters</button>'+
      '</div>'+
      '<div class="tablewrap">'+(filtered.length?
        '<table><thead><tr>'+th('asset','Vehicle No.')+th('year','Year')+th('make','Make')+th('model','Model')+th('dept','Department')+th('division','Division')+th('contact','Contact')+th('status','Status')+'</tr></thead><tbody>'+rows+'</tbody></table>'
        :'<div class="empty">No vehicles match.</div>')+'</div>'+
      '<div class="pager"><span>'+(filtered.length?('Showing '+(page*PAGE+1)+' to '+Math.min(filtered.length,page*PAGE+PAGE)+' of '+filtered.length.toLocaleString()):'')+'</span>'+
        '<span><button class="btn" id="pp"'+(page===0?' disabled':'')+'>Previous</button> <button class="btn" id="pn"'+(page>=pages-1?' disabled':'')+'>Next</button></span></div>';

    document.getElementById('fd').onchange=function(){f.dept=this.value;f.division='';page=0;applyFilters();renderList()};
    document.getElementById('fv').onchange=function(){f.division=this.value;page=0;applyFilters();renderList()};
    document.getElementById('fs').onchange=function(){f.status=this.value;page=0;applyFilters();renderList()};
    document.getElementById('fu').onchange=function(){f.supervisor=this.value;page=0;applyFilters();renderList()};
    document.getElementById('clr').onclick=function(){f={dept:'',division:'',status:'',supervisor:''};query='';q.value='';page=0;applyFilters();renderList()};
    document.getElementById('pp').onclick=function(){page--;renderList();window.scrollTo(0,0)};
    document.getElementById('pn').onclick=function(){page++;renderList();window.scrollTo(0,0)};
    Array.prototype.forEach.call(app.querySelectorAll('th[data-k]'),function(el){
      el.onclick=function(){var k=el.getAttribute('data-k');if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=1}applyFilters();renderList()}
    });
    Array.prototype.forEach.call(app.querySelectorAll('tbody tr'),function(el){
      el.onclick=function(){openAsset(el.getAttribute('data-id'))}
    });
  }

  function openAsset(id){tab='Overview';subtab='Services';location.hash=encodeURIComponent(id)}

  function fld(label,val,span){
    var has=val!==undefined&&val!==null&&String(val)!=='';
    return '<div class="f '+(span||'')+'"><label>'+esc(label)+'</label><div class="box'+(has?' has':'')+'">'+(has?esc(val):'')+'</div></div>';
  }
  function chk(label,on){return '<label><input type="checkbox" disabled'+(on?' checked':'')+'> '+esc(label)+'</label>'}

  function renderDetail(v){
    document.title=v.asset+' | Fleet Asset Lookup';
    var list=filtered.some(function(x){return x.asset===v.asset})?filtered:DATA.slice().sort(cmp);
    var i=list.findIndex(function(x){return x.asset===v.asset});
    var prev=i>0?list[i-1].asset:null, next=i<list.length-1?list[i+1].asset:null;
    var desc=[v.year,v.make,v.model].filter(Boolean).join(' ');
    var tabs=TABS.map(function(t){return '<button class="tab'+(t===tab?' on':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>'}).join('');
    var body;
    if(TABFN[tab]){
      body=TABFN[tab](v);
    } else {
      body='<div class="tabempty"><b>'+esc(tab)+'</b>'+esc(TABNOTE[tab]||'Nothing here yet. This fills in once the data is loaded.')+'</div>';
    }
    app.innerHTML=
      '<div class="crumbs"><button class="btn" id="back">&larr; All vehicles</button>'+
      '<button class="btn" id="pv"'+(prev?'':' disabled')+'>&lsaquo; Previous</button>'+
      '<span class="pos">'+(i+1).toLocaleString()+' of '+list.length.toLocaleString()+'</span>'+
      '<button class="btn" id="nx"'+(next?'':' disabled')+'>Next &rsaquo;</button></div>'+
      '<div class="titlebar"><h1>'+esc(v.asset)+'</h1><span class="sub">'+esc(desc)+'</span>'+badge(v.status)+((tab==='Overview'||tab==='Life Cycle')?'<span style="margin-left:auto">'+toggle()+'</span>':'')+'</div>'+
      '<div class="tabs">'+tabs+'</div>'+body;
    document.getElementById('back').onclick=function(){location.hash=''};
    var se=document.getElementById('se'); if(se)se.onchange=function(){showEmpty=se.checked;renderDetail(v)};
    if(prev)document.getElementById('pv').onclick=function(){openAsset(prev)};
    if(next)document.getElementById('nx').onclick=function(){openAsset(next)};
    Array.prototype.forEach.call(app.querySelectorAll('.tab[data-t]'),function(el){
      el.onclick=function(){tab=el.getAttribute('data-t');renderDetail(v)}
    });
    Array.prototype.forEach.call(app.querySelectorAll('.tab[data-st]'),function(el){
      el.onclick=function(){subtab=el.getAttribute('data-st');renderDetail(v)}
    });
    window.scrollTo(0,0);
  }

  q.addEventListener('input',function(){
    query=q.value;page=0;applyFilters();
    if(location.hash.length>1){location.hash=''}else{renderList()}
  });
  q.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    var ex=normAsset(q.value);
    if(ex){openAsset(ex);return}
    if(filtered.length===1){openAsset(filtered[0].asset)}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement!==q&&!/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)){e.preventDefault();q.focus();q.select()}
  });
  document.getElementById('brand').onclick=function(){location.hash=''};
  window.addEventListener('hashchange',render);

  fetch('vehicles.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
    DATA=d;d.forEach(function(v){BY[v.asset]=v});
    applyFilters();render();
  }).catch(function(err){
    app.innerHTML='<div class="empty">The vehicle data did not load ('+esc(err.message)+'). Try reloading the page.</div>';
  });
})();
</script>
</body>
</html>
