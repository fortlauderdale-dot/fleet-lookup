<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Asset Lookup</title>
<style>
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --ink:#1b2733; --muted:#5d6b78; --line:#d9dfe5;
    --nav:#14283d; --nav-ink:#ffffff; --accent:#1f6feb; --accent-soft:#e8f0fe;
    --ok:#1a7f45; --ok-bg:#e3f4ea; --bad:#b42318; --bad-bg:#fde8e6;
    --info:#175cd3; --info-bg:#e5eefc; --warn:#9a5b00; --warn-bg:#fdf1d9;
    --field:#f7f9fb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1720; --panel:#17212c; --ink:#e6ecf2; --muted:#9aa9b8; --line:#2a3846;
      --nav:#0b141e; --accent:#5b9bff; --accent-soft:#1c2c44;
      --ok:#5fd08d; --ok-bg:#16301f; --bad:#ff8a7e; --bad-bg:#3a1b18;
      --info:#7fb0ff; --info-bg:#1b2b47; --warn:#f2c36b; --warn-bg:#382a10;
      --field:#1b2733;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header.top{background:var(--nav);color:var(--nav-ink);display:flex;align-items:center;gap:20px;padding:10px 20px;position:sticky;top:0;z-index:10}
  .brand{font-weight:650;font-size:16px;white-space:nowrap;cursor:pointer}
  .brand small{display:block;font-weight:400;font-size:11px;opacity:.7}
  .searchwrap{position:relative;flex:1;max-width:560px}
  .searchwrap input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid transparent;font-size:15px;background:#fff;color:#1b2733}
  .searchwrap input:focus{outline:3px solid #7fb0ff}
  .hint{font-size:12px;opacity:.7;white-space:nowrap}
  main{max-width:2200px;margin:0 auto;padding:20px 28px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .tile .n{font-size:26px;font-weight:650;line-height:1.1}
  .tile .l{color:var(--muted);font-size:12px}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
  .filters label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
  select{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font-size:14px;min-width:170px}
  button{font:inherit;cursor:pointer}
  .btn{padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
  .btn:hover{background:var(--accent-soft)}
  .btn[disabled]{opacity:.4;cursor:default}
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:sticky;top:0;background:var(--panel);font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
  th .arr{opacity:.8}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--accent-soft)}
  td.asset{font-weight:600;color:var(--accent)}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .b-ok{background:var(--ok-bg);color:var(--ok)} .b-bad{background:var(--bad-bg);color:var(--bad)}
  .b-gray{background:var(--field);color:var(--muted);border:1px solid var(--line)}
  .b-info{background:var(--info-bg);color:var(--info)} .b-warn{background:var(--warn-bg);color:var(--warn)}
  .pager{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 4px;color:var(--muted)}
  .empty{padding:40px;text-align:center;color:var(--muted)}

  /* detail */
  .crumbs{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .crumbs .pos{color:var(--muted)}
  .titlebar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .titlebar h1{margin:0;font-size:20px}
  .titlebar .sub{color:var(--muted)}
  .tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
  .tab{padding:10px 14px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
  @media (max-width:900px){.cols{grid-template-columns:1fr}}
  fieldset{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px 16px 16px;margin:0 0 16px}
  legend{padding:0 8px;font-size:15px;font-weight:600}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(6,minmax(0,1fr))}
  .f{display:flex;flex-direction:column;gap:3px;grid-column:span 2}
  .f.s3{grid-column:span 3} .f.s4{grid-column:span 4} .f.s6{grid-column:span 6} .f.s2{grid-column:span 2}
  .f label{font-size:11px;color:var(--muted)}
  .f .box{min-height:36px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);overflow-wrap:anywhere}
  .f .box.has{background:var(--panel);font-weight:500}
  .checks{display:flex;gap:22px;flex-wrap:wrap;padding-top:6px}
  .checks label{display:flex;gap:7px;align-items:center;color:var(--ink)}
  .box.tall{min-height:150px}
  .f .box.calc{background:transparent;border-style:dashed}
  .cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  @media (max-width:900px){.cols2{grid-template-columns:1fr}}
  .tablewrap.static th{cursor:default}
  .qf{margin-bottom:10px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  .stat .sl{font-size:12px;color:var(--muted)} .stat .sv{font-size:20px;font-weight:650;line-height:1.25} .stat .ss{font-size:12px;color:var(--muted)}
  .chips{display:flex;gap:8px;margin-bottom:12px}.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 11px;font-size:12px;font-weight:600}
  .grp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px 12px;margin-bottom:12px}
  .grp h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
  .kvg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 18px}
  .kv span{display:block;font-size:11px;color:var(--muted)} .kv b{font-weight:500;overflow-wrap:anywhere} .kv .none{color:var(--muted);font-style:normal}
  .tog{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
  .cmt{padding:12px 16px}.cmeta{color:var(--muted);font-size:12px;margin-bottom:2px}
  .qf input{width:100%;max-width:340px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);font:inherit}
  .tabs.sub{margin-top:-4px}
  .tabs.sub .tab{padding:8px 14px}
  .gauge{height:120px;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
  .note{color:var(--muted);padding:6px 2px}
  .tabempty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:48px 20px;text-align:center;color:var(--muted)}
  .tabempty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
  .eqbox{display:flex;flex-direction:column;gap:3px;justify-content:flex-end;align-self:flex-end}
  .filters .eqbox label.ck{padding-bottom:0;font-size:13px;line-height:1.25}
  .nav{display:flex;gap:4px}
  .nav button{background:transparent;border:0;color:#fff;opacity:.7;padding:8px 14px;border-radius:7px;font-weight:600}
  .nav button:hover{opacity:1;background:rgba(255,255,255,.1)}
  .nav button.on{opacity:1;background:rgba(255,255,255,.18)}
  .seg{display:flex}.seg .btn{border-radius:0;margin-left:-1px}.seg .btn:first-child{border-radius:7px 0 0 7px;margin-left:0}.seg .btn:last-child{border-radius:0 7px 7px 0}
  .seg .btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .filters input[type=date]{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font:inherit}
  .filters .ck{flex-direction:row;align-items:center;gap:6px;padding-bottom:8px;color:var(--ink)}
  td.clip{max-width:380px;overflow:hidden;text-overflow:ellipsis}
  td.num,th.num{text-align:right}
  a.vl{color:var(--accent);font-weight:600;text-decoration:none}a.vl:hover{text-decoration:underline}
  .blk{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
  .cmt+.cmt{border-top:1px solid var(--line)}
  .ck2{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-right:6px}
  :root{--s1:#257de0;--s2:#f47230;--s3:#00b894;--s4:#f2a600;--s5:#ee7fac;--s6:#008a17;--s7:#6a4ce2;--s8:#ec4647;--good:#0aac23;--warn:#fbb315;--serious:#f18a59;--crit:#dc3c3d;--track:#eef1f4}
  @media (prefers-color-scheme: dark){:root{--s1:#338ced;--s2:#e76624;--s3:#00a888;--s4:#d28e05;--s5:#e24d8b;--s6:#0aac23;--s7:#9887ef;--s8:#eb6263;--track:#223140}}
  .dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}.dhead h1{margin:0;font-size:20px}.dhead .note{margin-left:auto;padding:0}
  .dsec{margin:18px 0 8px;font-size:14px;font-weight:650;color:var(--muted)}
  .dtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .dt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
  .dt .dn{font-size:26px;font-weight:650;line-height:1.1}.dt .dl{font-size:12px;color:var(--ink);margin-top:2px}.dt .ds{font-size:11px;color:var(--muted)}
  .dt.alert{border-color:var(--crit)}.dt.alert .dn{color:var(--crit)}
  .clk{cursor:pointer}.dt.clk:hover,.hr:hover,.cc:hover{background:var(--accent-soft)}.cc{border-radius:4px}.dt.clk:hover{border-color:var(--accent)}
  .dgrid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px}
  .dgrid .wide{grid-column:1/-1}
  @media (max-width:900px){.dgrid{grid-template-columns:1fr}}
  @media (min-width:1700px){.dgrid{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-flow:dense}}
  .dcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px 14px;min-width:0}
  .dcard h3{margin:0 0 10px;font-size:14px;font-weight:650}.dcard h3 span{display:block;font-weight:400;font-size:12px;color:var(--muted)}
  .hb{display:flex;flex-direction:column;gap:5px}
  .hr{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:10px;align-items:center;padding:2px 4px;border-radius:6px}
  .hl{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ht{height:16px}.hf{height:16px;border-radius:0 4px 4px 0}
  .hv{font-size:12px;color:var(--muted);min-width:70px;text-align:right;white-space:nowrap}
  .ch{padding-left:46px}
  .pa{position:relative}
  .gl{position:absolute;left:-46px;right:0;border-top:1px solid var(--line);height:0}
  .gl span{position:absolute;left:0;top:-8px;width:40px;text-align:right;font-size:11px;color:var(--muted);background:var(--panel)}
  .cr,.cl{display:grid}
  .cr{position:absolute;inset:0}
  .cc{height:100%;display:flex;align-items:flex-end;justify-content:center}
  .cs{width:min(24px,70%);display:flex;flex-direction:column-reverse;height:100%;justify-content:flex-start;border-radius:4px 4px 0 0}
  .sg{border-top:2px solid var(--panel);flex:none}.sg:first-child{border-top:0}
  .sg:last-child{border-radius:4px 4px 0 0}
  .cx{text-align:center;font-size:11px;color:var(--muted);padding-top:6px}
  .lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
  .tip{white-space:pre-line;position:fixed;z-index:50;display:none;background:var(--nav);color:#fff;font-size:12px;padding:5px 9px;border-radius:6px;pointer-events:none;max-width:320px}
  .prebar{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:7px 12px;margin-bottom:12px}
  .att{display:flex;flex-direction:column}
  .ar{cursor:pointer;align-items:center}.ar:hover{background:var(--accent-soft)}.ar>div:first-child::before{content:'\25B8';display:inline-block;width:16px;color:var(--muted)}.ar.open>div:first-child::before{content:'\25BE'}
  .ar>div:first-child{display:block}
  .apanel{display:none;padding:4px 6px 12px 22px;max-height:380px;overflow:auto}.ar.open+.apanel{display:block}
  .apanel .tablewrap{max-height:none}.apanel td,.apanel th{padding:6px 10px;font-size:13px}.amore{padding:8px 2px;color:var(--muted);font-size:12px}
  .ar{display:flex;justify-content:space-between;gap:12px;padding:8px 6px;border-top:1px solid var(--line)}.ar:first-child{border-top:0}
  .ar b{font-weight:650}.ar span{color:var(--muted);font-size:12px;display:block}
  .mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
  .mini div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.mini b{display:block;font-size:18px}.mini span{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brand">Fort Lauderdale Fleet<small>Asset lookup</small></div>
  <nav class="nav"><button id="navd">Dashboard</button><button id="navv">Vehicles</button><button id="navw">Work Orders</button></nav>
  <div class="searchwrap">
    <input id="q" type="search" autocomplete="off" placeholder="Type a vehicle number (V10060), plate, VIN, make, model, contact, notes..." aria-label="Search vehicles">
  </div>
  
</header>
<main id="app"><div class="empty">Loading vehicles...</div></main>

<script>
(function(){
  var DATA=[], BY={}, filtered=[], sortKey='asset', sortDir=1, page=0, PAGE=100;
  var f={dept:'',division:'',status:'',supervisor:''}, query='', tab='Overview', showEmpty=false;
  var app=document.getElementById('app'), q=document.getElementById('q');

  var TABS=['Overview','Life Cycle','Scheduling','Maintenance','Part Usage','Fuel','Meter Updates','Comments/Notes','Documents','Pictures','Occupants','Recalls','Purchase Orders'];
  var TABNOTE={
    'Documents':'Every file for this vehicle will live here, in one place.',
    'Purchase Orders':'Purchase orders will be created and tracked here.'
  };
  var subtab='Services';
  var WO=[], WOIDX={}, WOBY={}, WOLOADED=false, WOERR='', curMode='v';
  var wf={view:'Open',status:'',loc:'',tech:'',from:'',to:'',road:false,pre:null,eq:false,nt:false}, wq='', wsort={k:'d',dir:-1}, wpage=0, wfiltered=[], mq='', cq='';
  var EQN=0, NTN=0, NOW=Date.now(), dper='12m', gos=[], vpre=null, showEq=false, showNT=false;
  function isEq(a){return !/^V\d+$/i.test(a||'')}
  function isNT(a){return /^z(?!\d)/i.test(a||'')}
  function hiddenAsset(a,fe,nt){return isEq(a)&&(isNT(a)?!nt:!fe)}
  function fmtD(iso){return iso?iso.slice(5,7)+'/'+iso.slice(8,10)+'/'+iso.slice(0,4):''}
  function fmtDT(iso){if(!iso)return '';var h=+iso.slice(11,13),ap=h>=12?'PM':'AM';h=h%12||12;return fmtD(iso)+' '+h+':'+iso.slice(14,16)+' '+ap}
  function fdays(d){return d==null?'':d.toFixed(1)}
  function woText(w){return [w.x,w.cx,w.m].filter(Boolean).join(' | ')}

  function sec(title,inner){return '<fieldset><legend>'+esc(title)+'</legend>'+inner+'</fieldset>'}
  function grid(inner){return '<div class="grid">'+inner+'</div>'}
  function calc(label,span,val){var has=val!==undefined&&val!==null&&val!=='';return '<div class="f '+(span||'')+'"><label>'+esc(label)+(val===undefined?' (calculated)':'')+'</label><div class="box calc'+(has?' has':'')+'">'+(has?esc(val):'')+'</div></div>'}
  function chk2(label,on){return '<div class="f s6"><div class="checks"><label><input type="checkbox" disabled'+(on?' checked':'')+'> '+esc(label)+'</label></div></div>'}
  function qf(ph){return '<div class="qf"><input disabled placeholder="'+esc(ph)+'" aria-label="'+esc(ph)+'"></div>'}
  function tblRows(cols,rows){
    return '<div class="tablewrap static"><table><thead><tr>'+cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>'+
      rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';
  }
  function tbl(cols){
    return '<div class="tablewrap static"><table><thead><tr>'+cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead></table><div class="empty">No records to display.</div></div>';
  }

  function isE(x){return x===undefined||x===null||x===''}
  function kv(label,val){ if(isE(val)&&!showEmpty) return ''; return '<div class="kv"><span>'+esc(label)+'</span><b>'+(isE(val)?'<i class="none">&mdash;</i>':esc(val))+'</b></div>' }
  function grp(title,items){ var h=items.join(''); if(!h) return ''; return '<section class="grp"><h3>'+esc(title)+'</h3><div class="kvg">'+h+'</div></section>' }
  function stat(label,val,sub){ return '<div class="stat"><div class="sl">'+esc(label)+'</div><div class="sv">'+(isE(val)?'&mdash;':esc(val))+'</div>'+(sub?'<div class="ss">'+esc(sub)+'</div>':'')+'</div>' }
  function yn(b){return b?'Yes':''}
  function rnd(n){return Math.round(Number(n)).toLocaleString('en-US')}
  function usage(v){ if(v.meter==null)return ''; if(v.meterType==='No Meter'&&!v.meter)return ''; return rnd(v.meter)+(v.meterType==='Engine Hours'?' hours':' miles') }
  function eqShown(v){ return v.milesEq&&Math.round(v.milesEq)!==Math.round(v.meter||0) }
  function toggle(){return '<label class="tog"><input type="checkbox" id="se"'+(showEmpty?' checked':'')+'> Show empty fields</label>'}

  function mRows(v){
    var toks=norm(mq).split(/\s+/).filter(Boolean);
    var L=(WOBY[v.asset]||[]).filter(function(w){return toks.every(function(t){return w._h.indexOf(t)!==-1})});
    if(!L.length) return '<tr><td colspan="9" class="empty">No work orders match.</td></tr>';
    return L.map(function(w){
      return '<tr data-wo="'+w.n+'"><td class="asset">'+w.n+'</td><td>'+badge(w.s)+'</td><td>'+fmtD(w.d)+'</td><td>'+fmtD(w.c)+'</td><td class="num">'+fdays(w.days)+'</td><td>'+esc(w.l)+'</td><td>'+esc(w.t)+'</td><td class="clip" title="'+esc(woText(w))+'">'+esc(woText(w))+'</td><td class="num">'+money(w.k)+'</td></tr>';
    }).join('');
  }
  function bindWO(){
    Array.prototype.forEach.call(app.querySelectorAll('tr[data-wo]'),function(el){
      el.onclick=function(){location.hash='wo/'+el.getAttribute('data-wo')}
    });
    Array.prototype.forEach.call(app.querySelectorAll('a.vl[data-v]'),function(el){
      el.onclick=function(e){e.stopPropagation();e.preventDefault();tab='Maintenance';mq='';cq='';location.hash=encodeURIComponent(el.getAttribute('data-v'))}
    });
  }
  function stream(v){
    var out=[];
    if(v.comments) out.push({d:'',kind:'Collective Data',text:v.comments,meta:'Imported from Collective Data (no date or author)'});
    (WOBY[v.asset]||[]).forEach(function(w){
      var who=w.cb?' \u00b7 '+w.cb:'';
      if(w.x) out.push({d:w.d,wo:w.n,kind:'Work order',text:w.x,meta:fmtD(w.d)+who});
      if(w.cx) out.push({d:w.d,wo:w.n,kind:'Complaint',text:w.cx,meta:fmtD(w.d)+who});
      if(w.m) out.push({d:w.d,wo:w.n,kind:'WO note',text:w.m,meta:fmtD(w.d)+who});
    });
    return out;
  }
  function cRows(v){
    var toks=norm(cq).split(/\s+/).filter(Boolean);
    var L=stream(v).filter(function(e){var h=norm(e.text+' '+e.kind+' '+(e.wo||''));return toks.every(function(t){return h.indexOf(t)!==-1})});
    if(!L.length) return '<div class="empty">'+(cq?'Nothing matches.':'No comments yet.')+'</div>';
    return L.map(function(e){

  function applyFilters(){

      var hay=norm([v.asset,v.year,v.make,v.model,v.dept,v.division,v.status,v.plate,v.vin,v.category,v.type,v.classCode,v.contact,v.supervisor,v.glCode,v.comments].join(' '));
      return toks.every(function(t){return hay.indexOf(t)!==-1});

        '<label>Opened from<input type="date" id="wfr" value="'+esc(wf.from)+'"></label>'+
        '<label>Opened to<input type="date" id="wto" value="'+esc(wf.to)+'"></label>'+
        '<label class="ck"><input type="checkbox" id="wrc"'+(wf.road?' checked':'')+'> Road calls only</label>'+
        '<button class="btn" id="wclr">Clear filters</button>'+
        '<div class="eqbox"><label class="ck"><input type="checkbox" id="weq"'+(wf.eq?' checked':'')+'> Fleet Equipment</label><label class="ck"><input type="checkbox" id="wnt"'+(wf.nt?' checked':'')+'> Non Targeted</label></div>'+
      '</div>'+
      '<div class="tablewrap">'+(wfiltered.length?
        '<table><thead><tr>'+th('n','WO #')+th('a','Vehicle')+'<th>Vehicle description</th>'+th('d','Opened')+th('c','Closed')+th('days','Days Down','num')+th('s','Status')+th('l','Shop')+th('t','Technician')+th('x','Description')+th('k','Total Cost','num')+'</tr></thead><tbody>'+rows+'</tbody></table>'
        :'<div class="empty">No work orders match.</div>')+'</div>'+
      '<div class="pager"><span>'+(wfiltered.length?('Showing '+(wpage*PAGE+1)+' to '+Math.min(wfiltered.length,wpage*PAGE+PAGE)+' of '+wfiltered.length.toLocaleString()):'')+'</span>'+
        '<span><button class="btn" id="wpp"'+(wpage===0?' disabled':'')+'>Previous</button> <button class="btn" id="wpn"'+(wpage>=pages-1?' disabled':'')+'>Next</button></span></div>';
    function on(id,fn){document.getElementById(id).onchange=fn}
    on('ws',function(){wf.status=this.value;wpage=0;renderWO()});
    on('wl',function(){wf.loc=this.value;wpage=0;renderWO()});
    on('wt',function(){wf.tech=this.value;wpage=0;renderWO()});
    on('wfr',function(){wf.from=this.value;wpage=0;renderWO()});
    on('wto',function(){wf.to=this.value;wpage=0;renderWO()});
    on('weq',function(){wf.eq=this.checked;wpage=0;renderWO()});
    on('wnt',function(){wf.nt=this.checked;wpage=0;renderWO()});
    on('wrc',function(){wf.road=this.checked;wpage=0;renderWO()});
    var wpc=document.getElementById('wpc');if(wpc)wpc.onclick=function(){wf.pre=null;wpage=0;renderWO()};
    document.getElementById('wclr').onclick=function(){wf={view:'Open',status:'',loc:'',tech:'',from:'',to:'',road:false,pre:null,eq:false,nt:false};wq='';q.value='';wpage=0;renderWO()};
    document.getElementById('wpp').onclick=function(){wpage--;renderWO();window.scrollTo(0,0)};
    document.getElementById('wpn').onclick=function(){wpage++;renderWO();window.scrollTo(0,0)};
    Array.prototype.forEach.call(app.querySelectorAll('button[data-view]'),function(el){
      el.onclick=function(){wf.view=el.getAttribute('data-view');wf.status='';wpage=0;renderWO()}
    });
    Array.prototype.forEach.call(app.querySelectorAll('th[data-k]'),function(el){
      el.onclick=function(){var k=el.getAttribute('data-k');if(wsort.k===k)wsort.dir=-wsort.dir;else{wsort.k=k;wsort.dir=(k==='n'||k==='d'||k==='c'||k==='k'||k==='days')?-1:1}renderWO()}
    });
    bindWO();
  }
  function renderWODetail(id){
    var w=WOIDX[id];
    if(!WOLOADED){app.innerHTML='<div class="empty">'+esc(WOERR||'Loading work orders...')+'</div>';return}
    if(!w){app.innerHTML='<div class="crumbs"><button class="btn" id="wb">&larr; Work orders</button></div><div class="empty">Work order '+esc(id)+' was not found.</div>';document.getElementById('wb').onclick=function(){location.hash='wo'};return}
    document.title='WO '+w.n+' | Fleet';
    var v=BY[w.a];
    var vd=v?[v.year,v.make,v.model].filter(Boolean).join(' '):(w.ad||'');
    app.innerHTML=
      '<div class="crumbs"><button class="btn" id="wb">&larr; Work orders</button>'+(v?'<button class="btn" id="wv">Vehicle '+esc(w.a)+' &rsaquo;</button>':'')+'</div>'+
      '<div class="titlebar"><h1>WO '+w.n+'</h1><span class="sub">'+esc(w.a)+(vd?' \u00b7 '+esc(vd):'')+'</span>'+badge(w.s)+(w.ss?'<span class="badge b-gray">'+esc(w.ss)+'</span>':'')+(w.rc?'<span class="badge b-bad">Road call</span>':'')+'<span style="margin-left:auto">'+toggle()+'</span></div>'+
      '<div class="stats">'+stat('Days down',fdays(w.days),w.c?'Closed '+fmtD(w.c):'Open now')+stat('Total cost',money(w.k),w.b!=null?'Billable '+money(w.b):'')+stat('Labor hours',w.h!=null?String(w.h):'')+stat(v&&v.meterType==='Engine Hours'?'Meter in (hours)':'Meter in',w.mi!=null?rnd(w.mi):'')+'</div>'+
      '<section class="grp"><h3>Repair description</h3><div class="blk">'+esc(w.x||'No description')+'</div></section>'+
      (w.cx?'<section class="grp"><h3>Complaint</h3><div class="blk">'+esc(w.cx)+'</div></section>':'')+
      (w.m?'<section class="grp"><h3>Comments</h3><div class="blk">'+esc(w.m)+'</div></section>':'')+
      '<div class="cols2"><div>'+
        grp('Where and who',[kv('Shop',w.l),kv('Lead technician',w.t),kv('Substatus',w.ss),kv('Contact info',w.ct),kv('Created by',w.cb)])+
      '</div><div>'+
        grp('Timeline',[kv('Opened',fmtDT(w.d)),kv('Closed',fmtDT(w.c)),kv('Days down',fdays(w.days)),kv('Turn time (as reported)',w.tt!=null?String(w.tt):'')])+
        grp('Quality check and pickup',[kv('Quality check performed',w.qc?'Yes':'No'),kv('QC performed by',w.qb),kv('Pickup email sent',w.pe?'Yes':'No')])+
      '</div></div>';
    document.getElementById('wb').onclick=function(){location.hash='wo'};
    var wv=document.getElementById('wv'); if(wv)wv.onclick=function(){tab='Maintenance';mq='';cq='';location.hash=encodeURIComponent(w.a)};
    var se=document.getElementById('se'); if(se)se.onchange=function(){showEmpty=se.checked;renderWODetail(id)};
    window.scrollTo(0,0);
  }

  function renderList(){
    document.title='Fleet Asset Lookup';
    var inSvc=0,out=0,oth=0,ret=0;
    filtered.forEach(function(v){if(v.status==='In Service')inSvc++;else if(v.status==='Out of Service')out++;else if(/^Retired/.test(v.status))ret++;else oth++});
    var depts=uniq(DATA.map(function(v){return v.dept}));
    var divs=uniq(DATA.filter(function(v){return !f.dept||v.dept===f.dept}).map(function(v){return v.division}));
    var statuses=uniq(DATA.map(function(v){return v.status}));
    var sups=uniq(DATA.map(function(v){return v.supervisor}));
    function opts(list,sel,all){return '<option value="">'+all+'</option>'+list.map(function(x){return '<option'+(x===sel?' selected':'')+' value="'+esc(x)+'">'+esc(x)+'</option>'}).join('')}
    var pages=Math.max(1,Math.ceil(filtered.length/PAGE)); if(page>=pages)page=pages-1;
    var slice=filtered.slice(page*PAGE,page*PAGE+PAGE);
    function th(k,l){return '<th data-k="'+k+'">'+l+(sortKey===k?' <span class="arr">'+(sortDir>0?'&#9650;':'&#9660;')+'</span>':'')+'</th>'}
    var rows=slice.map(function(v){
      return '<tr data-id="'+esc(v.asset)+'"><td class="asset">'+esc(v.asset)+'</td><td>'+esc(v.year)+'</td><td>'+esc(v.make)+'</td><td>'+esc(v.model)+'</td><td>'+esc(v.dept)+'</td><td>'+esc(v.division)+'</td><td>'+esc(v.contact)+'</td><td>'+badge(v.status)+'</td></tr>';
    }).join('');
    app.innerHTML=
      (vpre?'<div class="prebar">Showing <b>'+esc(vpre.label)+'</b><button class="btn" id="vpc">Show all vehicles</button></div>':'')+
      '<div class="tiles">'+
        '<div class="tile"><div class="n">'+filtered.length.toLocaleString()+'</div><div class="l">Vehicles shown (of '+(DATA.length-(showEq?0:EQN)-(showNT?0:NTN)).toLocaleString()+')</div></div>'+
        '<div class="tile"><div class="n">'+inSvc.toLocaleString()+'</div><div class="l">In Service</div></div>'+
        '<div class="tile"><div class="n">'+out.toLocaleString()+'</div><div class="l">Out of Service</div></div>'+
        '<div class="tile"><div class="n">'+ret.toLocaleString()+'</div><div class="l">Retired, awaiting disposal</div></div>'+
        '<div class="tile"><div class="n">'+oth.toLocaleString()+'</div><div class="l">Prep or awaiting pickup</div></div>'+
      '</div>'+
      '<div class="filters">'+
        '<label>Department<select id="fd">'+opts(depts,f.dept,'All departments')+'</select></label>'+
        '<label>Division<select id="fv">'+opts(divs,f.division,'All divisions')+'</select></label>'+
        '<label>Status<select id="fs">'+opts(statuses,f.status,'All statuses')+'</select></label>'+
        '<label>Supervisor<select id="fu">'+opts(sups,f.supervisor,'All supervisors')+'</select></label>'+
        '<button class="btn" id="clr">Clear filters</button>'+
        '<div class="eqbox"><label class="ck"><input type="checkbox" id="feq"'+(showEq?' checked':'')+'> Fleet Equipment ('+EQN+')</label><label class="ck"><input type="checkbox" id="fnt"'+(showNT?' checked':'')+'> Non Targeted ('+NTN+')</label></div>'+
      '</div>'+
      '<div class="tablewrap">'+(filtered.length?
        '<table><thead><tr>'+th('asset','Vehicle No.')+th('year','Year')+th('make','Make')+th('model','Model')+th('dept','Department')+th('division','Division')+th('contact','Contact')+th('status','Status')+'</tr></thead><tbody>'+rows+'</tbody></table>'
        :'<div class="empty">No vehicles match.</div>')+'</div>'+
      '<div class="pager"><span>'+(filtered.length?('Showing '+(page*PAGE+1)+' to '+Math.min(filtered.length,page*PAGE+PAGE)+' of '+filtered.length.toLocaleString()):'')+'</span>'+
        '<span><button class="btn" id="pp"'+(page===0?' disabled':'')+'>Previous</button> <button class="btn" id="pn"'+(page>=pages-1?' disabled':'')+'>Next</button></span></div>';

    document.getElementById('fd').onchange=function(){f.dept=this.value;f.division='';page=0;applyFilters();renderList()};
    document.getElementById('fv').onchange=function(){f.division=this.value;page=0;applyFilters();renderList()};
    document.getElementById('fs').onchange=function(){f.status=this.value;page=0;applyFilters();renderList()};
    document.getElementById('fu').onchange=function(){f.supervisor=this.value;page=0;applyFilters();renderList()};
    document.getElementById('feq').onchange=function(){showEq=this.checked;page=0;applyFilters();renderList()};
    document.getElementById('fnt').onchange=function(){showNT=this.checked;page=0;applyFilters();renderList()};
    var vpc=document.getElementById('vpc');if(vpc)vpc.onclick=function(){vpre=null;applyFilters();renderList()};
    document.getElementById('clr').onclick=function(){vpre=null;showEq=false;showNT=false;f={dept:'',division:'',status:'',supervisor:''};query='';q.value='';page=0;applyFilters();renderList()};
    document.getElementById('pp').onclick=function(){page--;renderList();window.scrollTo(0,0)};
    document.getElementById('pn').onclick=function(){page++;renderList();window.scrollTo(0,0)};
    Array.prototype.forEach.call(app.querySelectorAll('th[data-k]'),function(el){
      el.onclick=function(){var k=el.getAttribute('data-k');if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=1}applyFilters();renderList()}
    });
    Array.prototype.forEach.call(app.querySelectorAll('tbody tr'),function(el){
      el.onclick=function(){openAsset(el.getAttribute('data-id'))}
    });
  }

  function openAsset(id){tab='Overview';subtab='Services';mq='';cq='';location.hash=encodeURIComponent(id)}

  function fld(label,val,span){
    var has=val!==undefined&&val!==null&&String(val)!=='';
    return '<div class="f '+(span||'')+'"><label>'+esc(label)+'</label><div class="box'+(has?' has':'')+'">'+(has?esc(val):'')+'</div></div>';
  }
  function chk(label,on){return '<label><input type="checkbox" disabled'+(on?' checked':'')+'> '+esc(label)+'</label>'}

  function renderDetail(v){
    document.title=v.asset+' | Fleet Asset Lookup';
    var list=filtered.some(function(x){return x.asset===v.asset})?filtered:DATA.slice().sort(cmp);
    var i=list.findIndex(function(x){return x.asset===v.asset});
    var prev=i>0?list[i-1].asset:null, next=i<list.length-1?list[i+1].asset:null;
    var desc=[v.year,v.make,v.model].filter(Boolean).join(' ');
    var tabs=TABS.map(function(t){return '<button class="tab'+(t===tab?' on':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>'}).join('');
    var body;
    if(TABFN[tab]){
      body=TABFN[tab](v);
    } else {
      body='<div class="tabempty"><b>'+esc(tab)+'</b>'+esc(TABNOTE[tab]||'Nothing here yet. This fills in once the data is loaded.')+'</div>';
    }
    app.innerHTML=
      '<div class="crumbs"><button class="btn" id="back">&larr; All vehicles</button>'+
      '<button class="btn" id="pv"'+(prev?'':' disabled')+'>&lsaquo; Previous</button>'+
      '<span class="pos">'+(i+1).toLocaleString()+' of '+list.length.toLocaleString()+'</span>'+
      '<button class="btn" id="nx"'+(next?'':' disabled')+'>Next &rsaquo;</button></div>'+
      '<div class="titlebar"><h1>'+esc(v.asset)+'</h1><span class="sub">'+esc(desc)+'</span>'+badge(v.status)+((tab==='Overview'||tab==='Life Cycle')?'<span style="margin-left:auto">'+toggle()+'</span>':'')+'</div>'+
      '<div class="tabs">'+tabs+'</div>'+body;
    document.getElementById('back').onclick=function(){location.hash=''};
    var se=document.getElementById('se'); if(se)se.onchange=function(){showEmpty=se.checked;renderDetail(v)};
    if(prev)document.getElementById('pv').onclick=function(){openAsset(prev)};
    if(next)document.getElementById('nx').onclick=function(){openAsset(next)};
    Array.prototype.forEach.call(app.querySelectorAll('.tab[data-t]'),function(el){
      el.onclick=function(){tab=el.getAttribute('data-t');renderDetail(v)}
    });
    Array.prototype.forEach.call(app.querySelectorAll('.tab[data-st]'),function(el){
      el.onclick=function(){subtab=el.getAttribute('data-st');renderDetail(v)}
    });
    var mf=document.getElementById('mf'); if(mf)mf.oninput=function(){mq=mf.value;document.getElementById('mbody').innerHTML=mRows(v);bindWO()};
    var cf=document.getElementById('cf'); if(cf)cf.oninput=function(){cq=cf.value;document.getElementById('cbody').innerHTML=cRows(v)};
    bindWO();
    window.scrollTo(0,0);
  }

  q.addEventListener('input',function(){
    if(curMode==='d'){query=q.value;page=0;applyFilters();location.hash='';return}
    if(curMode==='w'){
      wq=q.value;wpage=0;
      if(location.hash.length>3){location.hash='wo'}else{renderWO()}
      return;
    }
    query=q.value;page=0;applyFilters();
    if(location.hash.length>1){location.hash=''}else{renderList()}
  });
  q.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    if(curMode==='w'){
      var t=q.value.trim();
      if(WOIDX[t]){location.hash='wo/'+t;return}
      if(WOLOADED&&wfiltered.length===1){location.hash='wo/'+wfiltered[0].n}
      return;
    }
    var ex=normAsset(q.value);
    if(ex){openAsset(ex);return}
    if(filtered.length===1){openAsset(filtered[0].asset)}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement!==q&&!/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)){e.preventDefault();q.focus();q.select()}
  });
  document.getElementById('brand').onclick=function(){location.hash=''};
  document.getElementById('navv').onclick=function(){if(location.hash.length<2)render();else location.hash=''};
  document.getElementById('navd').onclick=function(){location.hash='dash'};
  var tip=document.createElement('div');tip.className='tip';document.body.appendChild(tip);
  app.addEventListener('mouseover',function(e){var t=e.target.closest&&e.target.closest('[data-tip]');if(t){tip.textContent=t.getAttribute('data-tip');tip.style.display='block'}else{tip.style.display='none'}});
  app.addEventListener('mousemove',function(e){tip.style.left=Math.max(4,Math.min(e.clientX+14,window.innerWidth-tip.offsetWidth-8))+'px';tip.style.top=(e.clientY+16)+'px'});
  app.addEventListener('mouseleave',function(){tip.style.display='none'});
  app.addEventListener('click',function(e){
    var t=e.target.closest&&e.target.closest('[data-tg]');if(t){t.classList.toggle('open');return}
    var rw=e.target.closest&&e.target.closest('.apanel tr[data-wo]');if(rw){location.hash='wo/'+rw.getAttribute('data-wo');return}
    var rv=e.target.closest&&e.target.closest('.apanel tr[data-v]');if(rv){openAsset(rv.getAttribute('data-v'));return}
    var g=e.target.closest&&e.target.closest('[data-go]');if(g){var fn=gos[+g.getAttribute('data-go')];if(fn){tip.style.display='none';fn()}}});
  document.getElementById('navw').onclick=function(){location.hash='wo'};
  window.addEventListener('hashchange',render);

  fetch('workorders.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
    d.forEach(function(w){
      var end=w.c?new Date(w.c).getTime():NOW;
      w.days=Math.max(0,(end-new Date(w.d).getTime())/864e5);
      w._h=norm([w.n,w.a,w.ad,w.x,w.cx,w.m,w.t,w.l,w.s,w.ss,w.cb,w.qb].join(' '));
      WOIDX[w.n]=w;
      if(w.a){(WOBY[w.a]=WOBY[w.a]||[]).push(w)}
    });
    WO=d;WOLOADED=true;
    if(DATA.length)render();
  }).catch(function(err){WOERR='The work order data did not load ('+err.message+'). Try reloading the page.';if(DATA.length)render()});
  fetch('vehicles.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
    DATA=d;d.forEach(function(v){BY[v.asset]=v;if(isEq(v.asset)){if(isNT(v.asset)){v.category='Non Targeted';NTN++}else{v.category='Fleet Equipment';EQN++}}});
    applyFilters();render();
  }).catch(function(err){
    app.innerHTML='<div class="empty">The vehicle data did not load ('+esc(err.message)+'). Try reloading the page.</div>';
  });
})();
</script>
</body>
</html>
